name: Ateliê Verde checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greenscape
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: greenscape_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U greenscape -d greenscape_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check backend/app backend/tests backend/migrations
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://greenscape:ci-only-password@localhost:5432/greenscape_test
      - run: python -m alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite:///migration-check.db
      - run: python -m alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: sqlite:///migration-check.db
      - run: python -c "import psycopg; conn=psycopg.connect(host='localhost', dbname='greenscape_test', user='greenscape', password='ci-only-password', autocommit=True); conn.execute('CREATE DATABASE greenscape_migrations'); conn.close()"
      - run: python -m alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://greenscape:ci-only-password@localhost:5432/greenscape_migrations
      - run: python -m alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+psycopg://greenscape:ci-only-password@localhost:5432/greenscape_migrations
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelieverde-screenshots
          path: docs/screenshots
